// ---------------- Audio (synth only) ----------------
const AudioSys = (() => {
  let ctx = null, master, sfx, mus, noiseBuf, muted = false, dest = null;
  try { muted = localStorage.getItem('shade_muted') === '1'; } catch (e) {}
  function ac() {
    if (!ctx) {
      try {
        ctx = new (window.AudioContext || window.webkitAudioContext)();
        master = ctx.createGain(); master.gain.value = muted ? 0 : 1; master.connect(ctx.destination);
        sfx = ctx.createGain(); sfx.connect(master);
        mus = ctx.createGain(); mus.gain.value = 0; mus.connect(master);
        const len = ctx.sampleRate * 0.5;
        noiseBuf = ctx.createBuffer(1, len, ctx.sampleRate);
        const d = noiseBuf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      } catch (e) { ctx = null; }
    }
    if (ctx && ctx.state === 'suspended') ctx.resume();
    return ctx;
  }
  function tone(dest, f, d, type, v, to, t) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (to) o.frequency.exponentialRampToValueAtTime(to, t + d);
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(v, t + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g).connect(dest); o.start(t); o.stop(t + d + 0.05);
  }
  function noise(dest, d, v, t, freq = 5000, type = 'highpass') {
    const s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    s.buffer = noiseBuf; f.type = type; f.frequency.value = freq;
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    s.connect(f).connect(g).connect(dest); s.start(t); s.stop(t + d + 0.02);
  }
  return {
    ac,
    get muted() { return muted; },
    toggleMute() {
      muted = !muted;
      try { localStorage.setItem('shade_muted', muted ? '1' : '0'); } catch (e) {}
      if (ctx) master.gain.setTargetAtTime(muted ? 0 : 1, ctx.currentTime, 0.05);
      if (window.syncMute) window.syncMute();
    },
    sfx(f, d, type = 'square', v = 0.08, to = null, delay = 0) { if (ac()) tone(sfx, f, d, type, v, to, ctx.currentTime + delay); },
    sfxNoise(d, v, freq, type, delay = 0) { if (ac()) noise(sfx, d, v, ctx.currentTime + delay, freq, type); },
    mus(f, d, type, v, t, to = null) { if (ctx) tone(mus, f, d, type, v, to, t); },
    musNoise(d, v, t, freq, type) { if (ctx) noise(mus, d, v, t, freq, type); },
    get bus() { return mus; },
    stream() { if (!ac()) return null; if (!dest) { dest = ctx.createMediaStreamDestination(); master.connect(dest); } return dest.stream; },
    get ctx() { return ctx; },
  };
})();

// ---------------- Music: a haunted synth score ----------------
// Music box lullabies, ghost-choir pads, bells, whispers and heartbeats,
// all through a big reverb so it sounds like an empty old house at night.
const Music = (() => {
  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
  let cur = null, step = 0, next = 0, timer = null, fx = null, songT0 = 0, intensity = 0;

  // reverb + echo, built once on the music bus
  function ensureFx() {
    const ctx = AudioSys.ctx; if (!ctx || fx) return fx;
    const bus = AudioSys.bus;
    const len = Math.floor(ctx.sampleRate * 3.2), ir = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let ch = 0; ch < 2; ch++) { const d = ir.getChannelData(ch); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.6); }
    const rev = ctx.createConvolver(); rev.buffer = ir;
    const wet = ctx.createGain(); wet.gain.value = 0.55; rev.connect(wet).connect(bus);
    const send = ctx.createGain(); send.gain.value = 1; send.connect(rev);
    const echo = ctx.createDelay(1.5); echo.delayTime.value = 0.42;
    const fb = ctx.createGain(); fb.gain.value = 0.38;
    const echoOut = ctx.createGain(); echoOut.gain.value = 0.5;
    echo.connect(fb).connect(echo); echo.connect(echoOut); echoOut.connect(bus); echoOut.connect(send);
    fx = { ctx, bus, send, echo };
    return fx;
  }
  // one voice: oscillator -> (filter) -> envelope -> dry bus + reverb send (+ echo)
  function voice(t, f, dur, { type = 'sine', vol = 0.05, attack = 0.01, release = null, detune = 0, cutoff = 0, rev = 0.5, echo = 0, vib = 0, to = null } = {}) {
    const F = ensureFx(); if (!F) return;
    const { ctx, bus } = F;
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t); o.detune.value = detune;
    if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur);
    if (vib) { const l = ctx.createOscillator(), lg = ctx.createGain(); l.frequency.value = 5.2; lg.gain.value = vib; l.connect(lg).connect(o.frequency); l.start(t); l.stop(t + dur + 0.1); }
    let node = o;
    if (cutoff) { const flt = ctx.createBiquadFilter(); flt.type = 'lowpass'; flt.frequency.value = cutoff; flt.Q.value = 0.7; o.connect(flt); node = flt; }
    const rel = release == null ? dur : release;
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + attack);
    g.gain.setValueAtTime(vol, t + Math.max(attack, dur - rel));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    node.connect(g); g.connect(bus);
    if (rev) { const s = ctx.createGain(); s.gain.value = rev; g.connect(s).connect(F.send); }
    if (echo) { const e = ctx.createGain(); e.gain.value = echo; g.connect(e).connect(F.echo); }
    o.start(t); o.stop(t + dur + 0.05);
  }
  function noiseV(t, dur, { vol = 0.02, freq = 1200, q = 4, sweep = 0, rev = 0.8 } = {}) {
    const F = ensureFx(); if (!F) return;
    const { ctx, bus } = F;
    const len = Math.floor(ctx.sampleRate * dur), buf = ctx.createBuffer(1, len, ctx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const s = ctx.createBufferSource(), flt = ctx.createBiquadFilter(), g = ctx.createGain();
    s.buffer = buf; flt.type = 'bandpass'; flt.frequency.setValueAtTime(freq, t); flt.Q.value = q;
    if (sweep) flt.frequency.exponentialRampToValueAtTime(freq * sweep, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + dur * 0.4); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(flt).connect(g); g.connect(bus);
    const r = ctx.createGain(); r.gain.value = rev; g.connect(r).connect(F.send);
    s.start(t); s.stop(t + dur);
  }
  // instruments
  const box = (t, n, v = 0.045) => { voice(t, mtof(n), 1.6, { vol: v, attack: 0.004, release: 1.5, rev: 0.6, echo: 0.5, detune: (Math.random() - 0.5) * 18 }); voice(t, mtof(n + 12), 0.9, { vol: v * 0.3, attack: 0.003, release: 0.85, rev: 0.6, echo: 0.4 }); };
  const choir = (t, notes, dur, v = 0.012) => notes.forEach(n => [-9, 0, 9].forEach(dt => voice(t, mtof(n), dur, { type: 'sawtooth', vol: v, attack: dur * 0.35, release: dur * 0.45, detune: dt, cutoff: 900, rev: 0.9, vib: 2.5 })));
  const drone = (t, n, dur, v = 0.035) => { voice(t, mtof(n), dur, { vol: v, attack: 1.2, release: 1.5, rev: 0.7 }); voice(t, mtof(n - 12), dur, { type: 'triangle', vol: v * 0.8, attack: 1.2, release: 1.5, rev: 0.5 }); };
  const bell = (t, n, v = 0.05) => [1, 2.76, 5.4, 8.93].forEach((p, i) => voice(t, mtof(n) * p, 3.5 - i * 0.6, { vol: v / (i + 1), attack: 0.003, release: 3 - i * 0.5, rev: 0.9 }));
  const kick = (t, v = 0.22) => voice(t, 110, 0.35, { vol: v, attack: 0.002, release: 0.33, to: 38, rev: 0.25 });
  const tom = (t, f = 140, v = 0.14) => voice(t, f, 0.3, { vol: v, attack: 0.002, release: 0.28, to: f * 0.55, rev: 0.4 });
  const heart = (t, v = 0.2) => { kick(t, v); kick(t + 0.18, v * 0.7); };
  const whisper = (t) => noiseV(t, 1.4 + Math.random(), { vol: 0.018, freq: 800 + Math.random() * 1500, q: 6, sweep: 0.5 + Math.random(), rev: 1 });
  const swell = (t, n, dur) => voice(t, mtof(n), dur, { type: 'sawtooth', vol: 0.02, attack: dur * 0.9, release: dur * 0.1, cutoff: 700, rev: 1, vib: 4 });

  // A harmonic minor lullaby (step -> midi), 64 steps = 4 bars
  const LULLABY = { 0: 69, 4: 72, 8: 76, 12: 74, 16: 72, 20: 71, 24: 68, 28: 64, 32: 69, 36: 72, 40: 76, 44: 77, 48: 76, 52: 74, 56: 71, 60: 68 };
  const DAWN = { 0: 72, 4: 76, 8: 79, 12: 77, 16: 76, 20: 74, 24: 72, 28: 67, 32: 69, 36: 72, 40: 76, 44: 77, 48: 79, 52: 76, 56: 74, 60: 72 };
  const BOSS_LEAD = { 0: 69, 6: 70, 8: 69, 12: 64, 16: 65, 22: 64, 24: 63, 28: 64, 32: 69, 38: 72, 40: 71, 44: 70, 48: 69, 54: 68, 56: 69 };
  const SONGS = {
    title: { bpm: 60, chords: [[57, 60, 64], [56, 59, 64], [57, 60, 64], [53, 57, 60]] },
    level: { bpm: 72, chords: [[57, 60, 64], [53, 57, 60], [50, 53, 57], [52, 56, 59]] },
    dark:  { bpm: 50, chords: [[45, 46], [44, 45]] },
    chase: { bpm: 150, chords: [[57, 60, 64], [57, 60, 63], [53, 57, 60], [52, 56, 59]] },
    boss:  { bpm: 128, chords: [[45, 52, 57], [41, 48, 53], [43, 50, 55], [40, 47, 52]] },
    dawn:  { bpm: 66, chords: [[60, 64, 67], [57, 60, 64], [53, 57, 60], [55, 59, 62]] },
  };
  function sched(name, s, t) {
    const S = SONGS[name], spb = 60 / S.bpm, st = spb / 4;
    const bar = Math.floor(s / 16), k = s % 16, ch = S.chords[bar % S.chords.length], k64 = s % 64;
    if (name === 'title' || name === 'dawn') {

      if (k === 0) { choir(t, ch, st * 16, 0.008); drone(t, ch[0] - 12, st * 16, 0.025); }
      if (k64 === 0 && name === 'title') bell(t, 57, 0.035);
      if (name === 'title' && k === 8 && bar % 4 === 2) whisper(t);
    } else if (name === 'level') {
      if (k === 0) { choir(t, ch, st * 16, 0.009); drone(t, ch[0] - 12, st * 16, 0.03); }
      if (k % 4 === 2) box(t, ch[(k / 4 | 0) % 3] + 12, 0.03);
      if (k === 0 || k === 8) heart(t, 0.13);
      if (k64 === 40) whisper(t);
      if (bar % 8 === 7 && k === 0) bell(t, 69, 0.03);
      if (intensity >= 1 && k % 4 === 0) kick(t, 0.12);                                  // combo layers
      if (intensity >= 1 && k % 2 === 1) noiseV(t, 0.06, { vol: 0.014, freq: 6500, q: 1, rev: 0.1 });
      if (intensity >= 2 && k % 2 === 0) box(t, ch[(k / 2 | 0) % 3] + 24, 0.022);
    } else if (name === 'dark') {
      if (k === 0 && bar % 2 === 0) { drone(t, ch[0], st * 32, 0.04); drone(t, ch[1], st * 32, 0.02); swell(t, ch[0] + 24 + 1, st * 30); }
      if (k === 0 || k === 8) heart(t, 0.18);
      if (k === 4 && Math.random() < 0.5) whisper(t);
      if (k === 12 && Math.random() < 0.35) box(t, [81, 82, 76, 75][Math.random() * 4 | 0], 0.025);
    } else if (name === 'chase') {
      if (k % 4 === 0) kick(t, 0.2);
      if (k % 2 === 1) tom(t, k % 4 === 1 ? 160 : 120, 0.09);
      voice(t, mtof(ch[0] - 24 + (k % 4 === 2 ? 6 : 0)), st * 0.9, { type: 'sawtooth', vol: 0.03, attack: 0.005, release: st * 0.8, cutoff: 1200, rev: 0.3 });   // tritone riff
      if (k === 0) choir(t, ch, st * 6, 0.012);
      if (k % 4 === 0) box(t, ch[(k / 4 | 0) % 3] + 24, 0.025);
      if (k64 === 0) bell(t, 57, 0.03);
      if (intensity >= 2 && k % 2 === 0) tom(t, 210, 0.05);
    } else if (name === 'boss') {
      if (k === 0) { choir(t, ch, st * 16, 0.014); bell(t, ch[0] + 12, 0.045); }
      if (k === 0 || k === 6 || k === 10) kick(t, 0.24);
      if (k === 4 || k === 12) tom(t, 110, 0.14);
      if (k === 14) tom(t, 150, 0.1);
      if (BOSS_LEAD[k64] !== undefined) voice(t, mtof(BOSS_LEAD[k64]), st * 5, { type: 'triangle', vol: 0.04, attack: 0.02, release: st * 4, rev: 0.6, vib: 3, echo: 0.25 });
      if (k % 2 === 0) voice(t, mtof(ch[0] - 12), st * 1.6, { type: 'sawtooth', vol: 0.02, attack: 0.005, release: st * 1.4, cutoff: 600, rev: 0.2 });
    }
  }
  function fadeTo(v, time) {
    const a = AudioSys.ctx, b = AudioSys.bus; if (!a) return;
    b.gain.cancelScheduledValues(a.currentTime); b.gain.setValueAtTime(b.gain.value, a.currentTime);

  }
  return {
    play(name) {
      const a = AudioSys.ac(); if (!a || cur === name) return;
      ensureFx();
      if (!timer) timer = setInterval(() => {
        const c = AudioSys.ctx; if (!c || !cur) return;
        const st = 60 / SONGS[cur].bpm / 4;
        if (next < c.currentTime) next = c.currentTime + 0.05;
        while (next < c.currentTime + 0.2) { sched(cur, step, next); next += st; step++; }
      }, 30);
      const start = () => { cur = name; step = 0; next = a.currentTime + 0.05; songT0 = next; fadeTo(0.9, 1.0); };
      if (cur) { fadeTo(0, 0.4); cur = null; setTimeout(start, 430); } else start();
    },
    stop() { fadeTo(0, 0.8); setTimeout(() => { cur = null; }, 820); },
    // 1 right on each beat, decaying to 0 before the next: visuals pulse with the music
    pulse() { const c = AudioSys.ctx; if (!c || !cur || AudioSys.muted) return 0; const ph = ((c.currentTime - songT0) * SONGS[cur].bpm / 60) % 1; return ph < 0 ? 0 : Math.pow(1 - ph, 4); },
    setIntensity(n) { intensity = n; },
  };
})();

// Milo, drawn with shapes so he animates smoothly. (x, y) = feet on the floor.
function drawKid(g, x, y, o) {
  const walk = o.walk || 0, moving = !!o.moving;
  const sw = moving ? Math.sin(walk) * (o.run ? 7 : 4.5) : 0;
  const bob = moving ? Math.abs(Math.cos(walk)) * 2 : Math.sin((o.time || 0) * 0.003) * 0.6;
  const by = y - bob, f = o.face || 1;
  const shake = o.scared ? (Math.random() - 0.5) * 1.6 : 0;
  // legs
  g.fillStyle(0x4a6ab0); g.fillRoundedRect(x - 7 + sw * 0.6, by - 19, 6, 17, 2); g.fillRoundedRect(x + 1 - sw * 0.6, by - 19, 6, 17, 2);
  g.fillStyle(0xf2c9a0); g.fillRect(x - 7 + sw * 0.6, by - 4, 7, 3); g.fillRect(x + 1 - sw * 0.6, by - 4, 7, 3);
  // back arm
  g.fillStyle(0x5677c0); g.fillRoundedRect(x - 13 * f - (f < 0 ? 5 : 0), by - 36 - sw * 0.4, 5, 14, 2);
  // pajama top with little stars
  g.fillStyle(0x6a8fd8); g.fillRoundedRect(x - 10, by - 39, 20, 23, 6);
  g.fillStyle(0xd8e4ff); g.fillCircle(x - 5, by - 32, 1.5); g.fillCircle(x + 4, by - 27, 1.5); g.fillCircle(x - 2, by - 21, 1.5);
  // head
  const hx = x + shake + f, hy = by - 51;
  g.fillStyle(0xf2c9a0); g.fillCircle(hx, hy, 12.5);
  // messy hair
  g.fillStyle(0x3b2a22);
  g.fillEllipse(hx - f, hy - 8, 27, 14);
  g.fillTriangle(hx - 12, hy - 6, hx - 7, hy - 9, hx - 13, hy + 2);
  g.fillTriangle(hx - 4, hy - 14, hx + 2, hy - 13, hx - 2, hy - 20);
  g.fillTriangle(hx + 4, hy - 13, hx + 10, hy - 10, hx + 9, hy - 18);
  g.fillTriangle(hx + 11, hy - 7, hx + 13, hy + 1, hx + 8, hy - 9);
  // eyes
  const ex = f * 2;
  if (o.blink) { g.fillStyle(0x15121f); g.fillRect(hx - 7 + ex, hy + 1, 5, 2); g.fillRect(hx + 2 + ex, hy + 1, 5, 2); }
  else {
    const eh = o.scared ? 9 : 8;
    g.fillStyle(0xffffff); g.fillEllipse(hx - 4.5 + ex, hy + 1, 7, eh); g.fillEllipse(hx + 4.5 + ex, hy + 1, 7, eh);
    g.fillStyle(0x2a1a14); g.fillEllipse(hx - 4 + ex * 1.4, hy + 2, 4, 5); g.fillEllipse(hx + 5 + ex * 1.4, hy + 2, 4, 5);
    g.fillStyle(0xffffff); g.fillRect(hx - 4 + ex * 1.4, hy, 1.5, 1.5); g.fillRect(hx + 5 + ex * 1.4, hy, 1.5, 1.5);
  }
  if (o.scared || o.cry) { g.fillStyle(0x3b2a22); g.fillRect(hx - 8 + ex, hy - 6, 5, 1.5); g.fillRect(hx + 3 + ex, hy - 6, 5, 1.5); }
  // mouth + tears
  if (o.cry) {
    g.fillStyle(0x8a4a3a); g.fillEllipse(hx + ex, hy + 8, 5, 3);
    g.fillStyle(0x8fd8ff, 0.9); g.fillRect(hx - 6 + ex, hy + 5, 1.5, 4 + ((o.time || 0) / 60) % 4); g.fillRect(hx + 6 + ex, hy + 5, 1.5, 4 + ((o.time || 0) / 70) % 4);
  } else if (o.scared) { g.fillStyle(0x8a4a3a); g.fillEllipse(hx + ex, hy + 8, 3.5, 4); }
  else if (o.smile) { g.lineStyle(1.5, 0x8a4a3a); g.beginPath(); g.arc(hx + ex, hy + 5, 3.5, 0.3, Math.PI - 0.3); g.strokePath(); }
  else { g.fillStyle(0x8a4a3a); g.fillRect(hx - 1.5 + ex, hy + 7, 3, 1.5); }
  g.fillStyle(0xff9a9a, 0.4); g.fillEllipse(hx - 8 + ex, hy + 5, 4, 2.5); g.fillEllipse(hx + 8 + ex, hy + 5, 4, 2.5);
  // front arm reaching to the candle
  if (o.hand) {
    const sx = x + 8 * f, sy = by - 35;
    g.lineStyle(5, 0x6a8fd8); g.lineBetween(sx, sy, o.hand.x, o.hand.y + 6);

  if (o.candle) {
    const c = o.candle;
    g.fillStyle(0xf4ead0); g.fillRect(c.x - 2.5, c.y, 5, 13);

      const fl = Math.sin((o.time || 0) * 0.03) * 1.2;
      g.fillStyle(0xff8a2a, 0.9); g.fillEllipse(c.x, c.y - 6, 6, 11 + fl);
      g.fillStyle(0xfff0b0, 1); g.fillEllipse(c.x, c.y - 5, 3, 6 + fl * 0.5);
    }
  }
}

// The kid's giant silhouette on the wall. lean > 0 leans right.
function drawShadowBody(g, bx, S, time, walk, alpha, lean = -0.1, color = 0x05030c, rim = 0) {
  const X = (x, y) => bx + x + (FLOOR - y) * lean;
  const sway = Math.sin(time * 0.0016) * S * 0.25;
  const parts = (grow, a) => {
    g.fillStyle(color, a);
    const st = Math.sin(walk) * S * 1.6;
    g.fillRect(X(-3.4 * S + st - grow * 0.2, FLOOR), FLOOR - 8 * S, 2.8 * S + grow * 0.4, 8 * S);
    g.fillRect(X(0.8 * S - st - grow * 0.2, FLOOR), FLOOR - 8 * S, 2.8 * S + grow * 0.4, 8 * S);
    g.fillPoints([
      { x: X(-5 * S - grow * 0.3, FLOOR - 8 * S), y: FLOOR - 8 * S },
      { x: X(5 * S + grow * 0.3, FLOOR - 8 * S), y: FLOOR - 8 * S },
      { x: X(4 * S + grow * 0.3 + sway, FLOOR - 17 * S), y: FLOOR - 17.5 * S - grow * 0.3 },
      { x: X(-4 * S - grow * 0.3 + sway, FLOOR - 17 * S), y: FLOOR - 17.5 * S - grow * 0.3 },
    ], true);
    const hx = X(sway, FLOOR - 22.5 * S), hy = FLOOR - 22.5 * S;
    g.fillCircle(hx, hy, 5.6 * S + grow * 0.3);
    g.fillTriangle(hx - 4 * S, hy - 3 * S, hx - 1 * S, hy - 5 * S, hx - 3 * S, hy - 8.5 * S);
    g.fillTriangle(hx, hy - 5 * S, hx + 3 * S, hy - 4 * S, hx + 1.5 * S, hy - 8 * S);
    g.fillTriangle(hx + 3 * S, hy - 4 * S, hx + 5.5 * S, hy - 1.5 * S, hx + 6.5 * S, hy - 6 * S);
    return { hx, hy };
  };
  if (rim) parts(S * 1.0, rim);
  parts(S * 1.2, alpha * 0.25);
  const head = parts(0, alpha);
  return {
    shoulder: { x: X(-4.2 * S + sway, FLOOR - 16 * S), y: FLOOR - 16 * S },
    shoulderR: { x: X(4.2 * S + sway, FLOOR - 16 * S), y: FLOOR - 16 * S },
    head: { x: head.hx, y: head.hy },
    chest: { x: X(sway, FLOOR - 13 * S), y: FLOOR - 13 * S },
  };
}

// A shadow claw hand at (x, y), pointing along ang.
function drawClaw(g, x, y, r, ang, closed, alpha = 0.92, color = 0x05030c) {
  g.fillStyle(color, alpha * 0.27); g.fillCircle(x, y, r * 1.4);
  g.fillStyle(color, alpha);
  if (closed) { g.fillCircle(x, y, r * 1.15); return; }
  g.fillCircle(x, y, r * 0.8);
  for (let f = -1.5; f <= 1.5; f += 1) {
    const fa = ang + f * 0.32;
    g.fillTriangle(x + Math.cos(fa + 1.4) * r * 0.28, y + Math.sin(fa + 1.4) * r * 0.28,
      x + Math.cos(fa - 1.4) * r * 0.28, y + Math.sin(fa - 1.4) * r * 0.28,
      x + Math.cos(fa) * r * 1.7, y + Math.sin(fa) * r * 1.7);
  }
  const ta = ang - 1.3;
  g.fillTriangle(x, y, x + Math.cos(ta + 0.3) * r * 0.5, y + Math.sin(ta + 0.3) * r * 0.5, x + Math.cos(ta) * r * 1.2, y + Math.sin(ta) * r * 1.2);
}

function drawArm(g, sh, hd, S, alpha = 0.88, color = 0x05030c) {
  const mx = (sh.x + hd.x) / 2 + (hd.y - sh.y) * 0.15, my = (sh.y + hd.y) / 2 - Math.abs(hd.x - sh.x) * 0.15;
  for (const [a, wMul] of [[alpha * 0.25, 1.6], [alpha, 1]]) for (let i = 0; i <= 12; i++) {
    const t = i / 12, u = 1 - t;
    const px = u * u * sh.x + 2 * u * t * mx + t * t * hd.x, py = u * u * sh.y + 2 * u * t * my + t * t * hd.y;
    g.fillStyle(color, a); g.fillCircle(px, py, (2.2 - 0.9 * t) * S * wMul);
  }
}

  // ================= forms =================
  setForm(f) {
    if (!this.unlocked.includes(f) || this.form === f) return;
    if (this.held) this.release();
    this.form = f; this.formFlash = 1; Sfx.form();
    this.smokeFx.explode(12, this.hand.x, this.hand.y);
  }
  cycleForm(d) {
    const u = this.unlocked; if (u.length < 2) return;
    this.setForm(u[(u.indexOf(this.form) + d + u.length) % u.length]);
  }
  action() {
    if (!this.canUseHand()) return;
    if (this.form === 'wolf') this.wolfDash();
    else if (this.form === 'raven') this.ravenFlock();
    else this.press();
  }
  wolfDash() {
    if (this.wolfCool > 0 || this.dash) return;
    const cam = this.cameras.main, ptr = this.input.activePointer, wp = cam.getWorldPoint(ptr.x, ptr.y);
    const o = this.shadowPose ? this.shadowPose.chest : { x: this.kid.x, y: FLOOR - 120 };
    let dx = wp.x - o.x, dy = Math.min(wp.y, FLOOR - 30) - o.y; const d = Math.hypot(dx, dy) || 1; dx /= d; dy /= d;
    const len = TUNE.wolfLen * (this.g > 0.5 ? 1.25 : 1);
    this.dash = { x0: o.x, y0: o.y, x1: o.x + dx * len, y1: Phaser.Math.Clamp(o.y + dy * len, 70, FLOOR - 30), t: 0, dur: 0.22, dir: dx >= 0 ? 1 : -1, hit: new Set(), boss: false };
    this.wolfCool = TUNE.wolfCool;
    Sfx.wolf(); this.cameras.main.shake(120, 0.006);
  }
  ravenFlock() {
    if (this.ravenCool > 0) return;
    const cam = this.cameras.main, ptr = this.input.activePointer, wp = cam.getWorldPoint(ptr.x, ptr.y);
    const o = this.shadowPose ? this.shadowPose.head : { x: this.kid.x, y: FLOOR - 200 };
    const targets = this.monsters.filter(m => m.alive && !m.held).sort((a, b) => Math.hypot(a.x - wp.x, a.y - wp.y) - Math.hypot(b.x - wp.x, b.y - wp.y));
    const flock = { bossHits: 0 };
    for (let i = 0; i < TUNE.ravenCount; i++) {
      const t = targets.length ? targets[i % targets.length] : null;
      const a = -Math.PI / 2 + (i - 2.5) * 0.4;
      this.ravens.push({ x: o.x, y: o.y, vx: Math.cos(a) * 300, vy: Math.sin(a) * 300, target: t, life: 1.8, aim: { x: wp.x + (i - 2.5) * 30, y: wp.y }, flock, seed: Math.random() * 10 });
    }
    this.ravenCool = TUNE.ravenCool;
    Sfx.ravens();
  }
  updateForms(dt) {
    this.wolfCool = Math.max(0, this.wolfCool - dt); this.ravenCool = Math.max(0, this.ravenCool - dt);
    this.formFlash = Math.max(0, (this.formFlash || 0) - dt * 2);
    const sc = this.S / TUNE.scaleNormal * 1.7;          // the dash wolf is BIG
    if (this.dash) {
      const D = this.dash; D.t += dt;
      const p = Math.min(1, D.t / D.dur), e = 1 - Math.pow(1 - p, 2);
      D.x = D.x0 + (D.x1 - D.x0) * e; D.y = D.y0 + (D.y1 - D.y0) * e;
      this.afterimages.push({ x: D.x, y: D.y, dir: D.dir, a: 0.45, s: sc });
      for (const m of this.monsters) {
        if (!m.alive || m.held || D.hit.has(m)) continue;
        if (Math.hypot(m.x - D.x, m.y - D.y) < m.r + 34 * sc) { D.hit.add(m); this.damage(m, 3, 'wolf'); }
      }
      if (this.boss && this.boss.stun > 0 && !D.boss) { const c = this.bossCore(); if (Math.hypot(c.x - D.x, c.y - D.y) < 90) { D.boss = true; this.bossDamage(2, 'wolf'); } }
      if (p >= 1) { if (D.hit.size >= 4) this.big('PACK HUNT x' + D.hit.size + '!', '#ffb347', 16, 0.8, 140); this.dash = null; }
    }
    for (const a of this.afterimages) a.a -= dt * 2.2;
    this.afterimages = this.afterimages.filter(a => a.a > 0);
    for (const r of this.ravens) {
      r.life -= dt;
      let tx = r.aim.x, ty = r.aim.y;
      if (r.target && r.target.alive) { tx = r.target.x; ty = r.target.y; }
      else if (this.boss && this.boss.stun > 0) { const c = this.bossCore(); tx = c.x; ty = c.y; }
      const dx = tx - r.x, dy = ty - r.y, d = Math.hypot(dx, dy) || 1;
      r.vx += (dx / d * 760 - r.vx) * Math.min(1, dt * 7); r.vy += (dy / d * 760 - r.vy) * Math.min(1, dt * 7);
      r.x += r.vx * dt; r.y += r.vy * dt;
      for (const m of this.monsters) if (m.alive && !m.held && Math.hypot(m.x - r.x, m.y - r.y) < m.r + 10) { this.damage(m, 1, 'raven'); r.life = 0; this.featherFx.explode(8, r.x, r.y); break; }
      if (r.life > 0 && this.boss && this.boss.stun > 0 && r.flock.bossHits < 2) { const c = this.bossCore(); if (Math.hypot(c.x - r.x, c.y - r.y) < 60) { r.flock.bossHits++; r.life = 0; this.featherFx.explode(10, r.x, r.y); this.bossDamage(1, 'raven'); } }
      if (r.life > 0 && !(r.target && r.target.alive) && d < 20) r.life = Math.min(r.life, 0.1);
    }
    this.ravens = this.ravens.filter(r => r.life > 0);
  }

  get S() { return (TUNE.scaleNormal + (TUNE.scaleGiant - TUNE.scaleNormal) * this.g) * (this.rage > 0 ? 1.15 : 1); }
  get lightR() { return this.lit ? TUNE.lightNormal + (TUNE.lightGiant - TUNE.lightNormal) * this.g : 0; }
  get candlePos() { return { x: this.kid.x + 15 * this.kid.face, y: FLOOR - 46 + this.g * 14 }; }
  get handR() { return TUNE.handPerScale * this.S * (this.rage > 0 ? 1.3 : 1); }
  get reach() { return TUNE.reachPerScale * this.S * (this.R.type === 'boss' ? 1.3 : 1); }

  // ================= hand =================
  canUseHand() { return this.state === 'play' && this.mode !== 'dark' && this.shadowA > 0.5; }
  press() {
    const hd = this.hand, r = this.handR * 1.5;
    let best = null, bd = 1e9;
    for (const m of this.monsters) {
      if (!m.alive || m.thrown) continue;
      const d = Math.hypot(m.x - hd.x, m.y - hd.y) - m.r;
      if (d < r && d < bd) { bd = d; best = m; }
    }
    if (best && MONSTER[best.type].grab) {
      this.held = best; best.held = true; best.lunge = 0; best.wind = 0; best.march = false;
      Sfx.grab(); this.smokeFx.explode(6, best.x, best.y);
    } else {
      if (best && !MONSTER[best.type].grab && bd < this.handR * 0.6) this.popup(best.x, best.y - 30, 'TOO HEAVY! TRY THE WOLF', '#c9a8ff');
      this.smash();
    }
  }
  release() {
    const m = this.held; if (!m) return;
    this.held = null; m.held = false;
    let vx = 0, vy = 0; const hs = this.hand.hist;
    for (const v of hs) { vx += v[0]; vy += v[1]; }
    vx /= Math.max(1, hs.length); vy /= Math.max(1, hs.length);
    const sp = Math.hypot(vx, vy), max = 1500;
    if (sp > max) { vx *= max / sp; vy *= max / sp; }
    m.vx = vx; m.vy = vy;
    if (sp > 260) { m.thrown = 1.4; Sfx.throwIt(); } else m.thrown = 0.6;
  }
  smash() {
    if (this.cool > 0) return;
    this.cool = 0.2; this.hand.slam = 0.16;
    const r = this.handR * 1.3;
    let hit = 0;
    for (const m of this.monsters) if (m.alive && !m.held && Math.hypot(m.x - this.hand.x, m.y - this.hand.y) < r + m.r) { this.damage(m, 1, 'smash'); hit++; }
    if (this.boss) this.smashBoss();
    Sfx.smash(); this.smokeFx.explode(10, this.hand.x, this.hand.y);
    this.cameras.main.shake(hit ? 140 : 70, hit ? 0.009 : 0.003);
  }

  // ================= monsters =================
  spawnMonster(type, x, y, extra) {
    const T = MONSTER[type];
    if (type === 'brute') y = FLOOR - T.r;
    const m = Object.assign({ type, x, y, vx: 0, vy: 0, r: T.r, hp: T.hp, alive: true, sp: T.sp * (0.9 + Math.random() * 0.25),
      seed: Math.random() * 10, born: 0, lungeT: 1.2 + Math.random() * 2, wind: 0, lunge: 0, held: false, thrown: 0, flash: 0, march: false }, extra || {});
    if (type === 'wisp' && !m.march && Math.random() < (this.auto ? 0.2 : 0.09)) m.golden = true;      // rare jackpot monster (more often in the trailer)
    this.monsters.push(m);
    this.smokeFx.explode(16, Phaser.Math.Clamp(x, this.cameras.main.scrollX + 10, this.cameras.main.scrollX + W - 10), y);
    Sfx.spawn();
    const cfg = { wisp: ['NIGHTLING', 'FEEDS ON FEAR.\nGRAB IT. THROW IT.', '#ffe066'], brute: ['BRUTE', 'TOO HEAVY TO GRAB.\nTHROW THINGS AT IT.', '#ff6a8a'], snuffer: ['SNUFFER', 'IT WANTS THE CANDLE.\nSWAT IT FIRST!', '#7fe8ff'] }[type];
    this.introOnce(type, () => ({ x: Phaser.Math.Clamp(m.x, this.cameras.main.scrollX + 80, this.cameras.main.scrollX + W - 80), y: m.y }), cfg[0], cfg[1], cfg[2], type === 'snuffer' ? 900 : 650);
    return m;
  }
  spawnEntry(e) {
    const cam = this.cameras.main, L = cam.scrollX - 20, Rr = cam.scrollX + W + 20;
    if (e.conga) {
      const dir = e.conga === 'R' ? 1 : -1;
      for (let i = 0; i < e.n; i++) {
        const x = (dir > 0 ? Rr : L) + dir * i * 56;
        this.spawnMonster(e.type, x, e.y || FLOOR - 40, { march: true, sp: 70 });
      }
      return;
    }
    const [type, side, y] = e;
    const x = side === 'L' ? L : side === 'R' ? Rr : cam.scrollX + 120 + Math.random() * (W - 240);
    this.spawnMonster(type, x, side === 'T' ? 60 : FLOOR - (y || 200));
  }
  nextWave() {
    const waves = this.R.waves;
    this.waveIdx++;
    if (this.waveIdx >= waves.length) { this.roomClear(); return; }
    const list = waves[this.waveIdx];
    this.pending = list.length;
    if (this.waveIdx === waves.length - 1 && waves.length > 1) this.big('FINAL WAVE', '#ff6a8a', 16, 0.9, 140);
    list.forEach((e, i) => this.time.delayedCall(i * 240, () => { if (this.state === 'play' || this.state === 'freeze') { this.spawnEntry(e); } this.pending--; }));
  }
  damage(m, n, how) {
    m.hp -= n; m.flash = 0.15;
    if (m.type === 'brute' && m.hp > 0) {
      m.vx = Math.sign(m.x - this.kid.x || 1) * 220;
      this.popup(m.x, m.y - 40, 'HIT!', '#ffffff'); Sfx.thud(); this.stopT = Math.max(this.stopT, 0.035);
      return;
    }
    if (m.hp <= 0) this.killMonster(m, how);
  }
  killMonster(m, how) {
    if (!m.alive) return;
    m.alive = false;
    if (this.held === m) this.held = null;
    this.poofFx.explode(m.type === 'brute' ? 50 : 26, m.x, m.y);
    this.splats.push({ x: m.x + (Math.random() - 0.5) * 10, y: m.y, r: m.r * (1.2 + Math.random() * 0.6), t: 5, seed: Math.random() * 10 });
    Sfx.poof();
    if (how === 'quiet') return;
    // embers: some kills send sparks into the candle (a little wax back)
    const nSpark = m.golden ? 10 : Math.random() < 0.3 ? 2 : 0;
    for (let i = 0; i < nSpark; i++) this.sparks.push({ x: m.x, y: m.y, vx: (Math.random() - 0.5) * 300, vy: -150 - Math.random() * 200, t: 0, wax: m.golden ? 1.2 : 1.5 });
    // a kill right next to Milo is a close call
    const near = Math.hypot(m.x - this.kid.x, m.y - (FLOOR - 32));
    if (near < 70 && this.state === 'play' && this.R.type !== 'wind') this.closeCall(m);
    this.combo = this.comboT > 0 ? this.combo + 1 : 1;
    this.comboT = TUNE.comboWindow;
    this.bestCombo = Math.max(this.bestCombo, this.combo);
    const mult = { throw: 2, wolf: 1.5, raven: 1.3 }[how] || 1;
    const pts = Math.round(MONSTER[m.type].score * this.combo * mult * (m.golden ? 5 : 1));
    if (m.golden) { Sfx.golden(); this.goldFx.explode(60, m.x, m.y); this.big('GOLDEN!  x5', '#ffd700', 20, 0.7, 150); this.cameras.main.flash(120, 255, 215, 80); }
    this.score += pts;
    this.popup(m.x, m.y - 20, (how === 'throw' ? 'THROW! ' : '') + '+' + pts, { throw: '#ffb347', wolf: '#ffb347', raven: '#7fe8ff' }[how] || '#e8e2ff');
    if (this.combo >= 3) { this.comboTxt.setScale(1.5); this.tweens.add({ targets: this.comboTxt, scale: 1, duration: 200 }); Sfx.combo(this.combo); }
    for (const [n, name, col] of COMBO_TIERS) if (this.combo === n) { this.big(name + '!', col, 22, 0.8, 150); Sfx.tier(); break; }
    this.stopT = Math.max(this.stopT, how === 'throw' ? 0.07 : 0.04);
    this.punch = Math.min(0.06, this.punch + 0.02);
    // slow-motion on the last kill of a fight room
    if (this.R.type === 'fight' && this.waveIdx === this.R.waves.length - 1 && this.pending <= 0 && !this.monsters.some(o => o.alive)) {
      this.slowmo(1.3); this.punch = 0.1; this.cameras.main.flash(150, 255, 255, 255);
    }
  }
  impact(x, y, thrower) {
    Sfx.boom(); this.boomFx.explode(40, x, y);
    this.cameras.main.shake(220, 0.014); this.cameras.main.flash(80, 120, 80, 200);
    this.killMonster(thrower, 'throw');
    for (const o of this.monsters) {
      if (!o.alive || o.held || o === thrower) continue;
      if (Math.hypot(o.x - x, o.y - y) < 75 + o.r) this.damage(o, 3, 'throw');
    }
  }
  popup(x, y, text, color) {
    const t = addText(this, x, y, text, 10, color).setOrigin(0.5).setDepth(9).setShadow(0, 0, '#000', 4, false, true);
    this.tweens.add({ targets: t, y: y - 40, alpha: 0, duration: 900, ease: 'Cubic.easeOut', onComplete: () => t.destroy() });
  }
  // one-time contextual hints (they only appear when the move is useful)
  hint(key, text, dur = 4.5) {
    if (this.auto || this.trailer || this.hintsSeen[key] || this.hintBusy > 0) return false;
    this.hintsSeen[key] = true; this.registry.set('hints', this.hintsSeen);
    this.hintBusy = dur + 0.5;
    this.hintTxt.setText('TIP:  ' + text).setAlpha(0).setScale(1.1);
    this.tweens.killTweensOf(this.hintTxt);
    this.tweens.add({ targets: this.hintTxt, alpha: 1, scale: 1, duration: 220 });
    this.tweens.add({ targets: this.hintTxt, alpha: 0, duration: 400, delay: dur * 1000 });
    Sfx.blip();
    return true;
  }
  checkHints(dt) {
    this.hintBusy = Math.max(0, this.hintBusy - dt);
    if (this.hintBusy > 0) return;
    const k = this.kid, ms = this.monsters.filter(m => m.alive && !m.held), cp = this.candlePos;
    const has = (f) => this.unlocked.includes(f);
    if (ms.some(m => m.type === 'brute')) this.hint('brute', has('wolf') ? 'BRUTES ARE TOO HEAVY TO GRAB.\nPRESS 2 FOR WOLF AND CLICK TO DASH THROUGH IT!' : 'BRUTES ARE TOO HEAVY TO GRAB.\nHOLD CLICK ON A SMALL ONE, SWING, LET GO TO THROW IT!');
    else if (ms.some(m => m.type === 'snuffer' && Math.hypot(m.x - cp.x, m.y - cp.y) < 230)) this.hint('moth', 'THAT MOTH WANTS THE CANDLE!\nSWAT IT BEFORE IT REACHES THE FLAME!');
    else if (this.wax < TUNE.waxMax * 0.3 && this.R.type !== 'wind') this.hint('wax', 'THE CANDLE IS RUNNING LOW!\nKILL MONSTERS - THEIR EMBERS REFILL IT. DON\'T STAY GIANT TOO LONG.');
    else if (k.courage === 1) this.hint('courage', 'MILO HAS ONE HEART LEFT!\nSMASH MONSTERS BEFORE THEY REACH HIM - RED EYES MEAN THEY WILL LUNGE!');
    else if (has('wolf') && this.form !== 'wolf' && ms.filter(m => m.march).length >= 3 && this.roomT > 3) this.hint('wolfuse', 'A LINE OF MONSTERS!\nPRESS 2 FOR WOLF, THEN CLICK TO DASH THROUGH ALL OF THEM.');
    else if (has('raven') && this.form !== 'raven' && ms.length >= 5 && this.roomT > 3) this.hint('ravenuse', 'SO MANY OF THEM!\nPRESS 3 FOR RAVENS, THEN CLICK TO SEND THE FLOCK.');
    else if (this.chase && this.hasStop && this.stopCool <= 0 && k.x - this.chase.x < 170) this.hint('stop', 'THE DARK IS CATCHING UP!\nPRESS F TO STOP TIME AND FREEZE IT!');
    else if (this.R.type === 'fight' && this.roomT > 6 && this.form === 'hand' && ms.length >= 2 && !this.hintsSeen.throwhint) this.hint('throwhint', 'COMBO TRICK: HOLD CLICK ON A MONSTER, SWING YOUR MOUSE\nAND LET GO - IT EXPLODES INTO THE OTHERS!');
    else if (this.boss && this.missedParry >= 2) this.hint('parryhelp', 'PARRY TIP: PRESS 1 FOR HAND, HOLD SPACE FOR A BIGGER HAND,\nAND KEEP IT ON THE YELLOW DOT UNTIL THE SLAM.');
  }
  closeCall(m) {
    if (this.time.now - (this.lastClose || 0) < 2500) return;
    this.lastClose = this.time.now;
    this.slowmo(0.55); Sfx.close(); this.punch = 0.07;
    this.score += 250; this.popup(this.kid.x, FLOOR - 110, 'CLOSE CALL! +250', '#7fe8ff');
    this.miloSay(Phaser.Utils.Array.GetRandom(['THANK YOU, SHADE!', 'THAT WAS CLOSE!', "YOU'RE THE BEST!", 'WHEW!', 'DON\'T LEAVE ME!']));
  }
  miloSay(text, dur = 1.8) {
    if (this.bubble) this.bubble.destroy();
    this.bubble = addText(this, this.kid.x, FLOOR - 76, text, 8, '#ffffff', { backgroundColor: '#1a1430', padding: { x: 6, y: 5 } }).setOrigin(0.5, 1).setDepth(9.5);
    const b = this.bubble;
    this.time.delayedCall(dur * 1000, () => this.tweens.add({ targets: b, alpha: 0, duration: 300, onComplete: () => { b.destroy(); if (this.bubble === b) this.bubble = null; } }));
  }
  hurtKid() {
    const k = this.kid;
    if (k.invuln > 0 || this.state !== 'play') return;
    k.courage--; k.invuln = 1.6; this.hits++;
    this.combo = 0; this.comboT = 0;
    Sfx.whimper();
    this.cameras.main.shake(260, 0.012); this.cameras.main.flash(200, 90, 0, 30);
    if (k.courage <= 0) this.fail('THE DARK GOT HIM...');
  }

  // ================= room: THE WIND =================
  // Gusts blow from a window. Put your shadow hand on the glowing circle beside the candle
  // (the side the wind comes from) to block it. The first gust waits for you (tutorial).
  // A missed gust only shrinks the candle; the wind never fully blows it out.
  windStart() {
    this.say('A STORM IS COMING!', 2);
    this.gusts = []; const sides = this.auto ? ['L', 'R', 'L'] : ['L', 'R', 'L', 'R', 'R', 'L', 'R', 'L'];
    let t = 2.2;
    sides.forEach((s, i) => { this.gusts.push({ t, side: s, state: 'wait', teach: i === 0 && !this.auto }); t += Math.max(1.5, 2.6 - i * 0.14); });
    this.windT = 0; this.windEnd = t + 0.8;
    this.shieldTxt = addText(this, 0, 0, 'PUT YOUR\nHAND HERE', 8, '#ffd27a', { align: 'center', lineSpacing: 4 }).setOrigin(0.5).setDepth(12).setVisible(false).setShadow(0, 0, '#000', 6, true, true);
    this.time.delayedCall(6500, () => { if (this.state === 'play') { this.spawnEntry(['snuffer', 'T', 0]); this.spawnEntry(['wisp', 'R', 260]); } });
    this.time.delayedCall(12500, () => { if (this.state === 'play' && !this.auto) { this.spawnEntry(['snuffer', 'L', 160]); this.spawnEntry(['wisp', 'L', 300]); } });
  }
  shieldPoint(side) { const cp = this.candlePos; return { x: cp.x + (side === 'L' ? -55 : 55), y: cp.y - 10 }; }
  shielded(side) {
    if (!this.canUseHand()) return false;
    const p = this.shieldPoint(side), cp = this.candlePos, hx = this.hand.x - cp.x;
    return Math.hypot(this.hand.x - p.x, this.hand.y - p.y) < 115 && (side === 'L' ? hx < 15 : hx > -15);
  }
  updateWind(dt) {
    const cp = this.candlePos;
    const teaching = this.gusts.find(g => g.teach && g.state === 'warn');
    if (teaching) {                       // tutorial gust: wait until the hand is in place
      if (!teaching.prompted) { teaching.prompted = true; this.say('MOVE YOUR SHADOW HAND\nONTO THE GLOWING CIRCLE!', 60); }
      if (this.shielded(teaching.side)) { teaching.held = (teaching.held || 0) + dt; if (teaching.held > 0.35) { teaching.teach = false; this.windT = teaching.t; } }
      else teaching.held = 0;
      teaching.waitT = (teaching.waitT || 0) + dt;
      if (teaching.waitT > 12 && teaching.teach) { teaching.teach = false; this.windT = teaching.t; }   // never get stuck here
    } else this.windT += dt;
    for (const g of this.gusts) {
      if (g.state === 'wait' && this.windT >= g.t - 1.2) { g.state = 'warn'; Sfx.windup(); }
      if (g.state === 'warn' && !g.teach && this.windT >= g.t) {
        g.state = 'blow'; Sfx.wind();
        const fromL = g.side === 'L';
        this.windFx.speedX = fromL ? { min: 700, max: 1100 } : { min: -1100, max: -700 };
        for (let i = 0; i < 45; i++) this.windFx.emitParticleAt(fromL ? -10 : W + 10, 80 + Math.random() * 380);
        if (this.shielded(g.side)) {
          this.score += 250; this.popup(this.hand.x, this.hand.y - 34, g.prompted ? 'BLOCKED! JUST LIKE THAT!' : 'BLOCKED! +250', '#ffd27a');
          if (g.prompted) this.say('NOW KEEP BLOCKING THE GUSTS!', 2.5);
          this.goldFx.explode(24, this.hand.x, this.hand.y); Sfx.clash(); this.cameras.main.shake(120, 0.006);
        } else {
          this.wax = Math.max(18, this.wax - 12); this.flick = 0.8; this.hits++;
          this.popup(cp.x, cp.y - 34, 'MISSED! THE FLAME SHRINKS', '#9fe8ff'); this.blueFx.explode(16, cp.x, cp.y); Sfx.snuff();
          this.cameras.main.shake(200, 0.01);
        }
        for (const m of this.monsters) if (m.alive && !m.held) m.vx += (fromL ? 1 : -1) * 500;
        g.blowT = 0.5;
      }
      if (g.state === 'blow') { g.blowT -= dt; if (g.blowT <= 0) g.state = 'done'; }
    }
    if (this.windT >= this.windEnd && !this.monsters.some(m => m.alive) && this.state === 'play') { this.big('THE STORM PASSES.', '#ffffff', 14, 1.0, 140); if (this.shieldTxt) this.shieldTxt.setVisible(false); this.roomClear(); }
  }
  drawWind(time) {
    const g = this.curtG; if (!g) return; g.clear();
    const eg = this.fxG;
    let showTarget = null;
    for (const side of ['L', 'R']) {
      const active = this.gusts && this.gusts.find(x => x.side === side && (x.state === 'warn' || x.state === 'blow'));
      const flap = active ? Math.sin(time * (active.state === 'blow' ? 0.06 : 0.03)) * (active.state === 'blow' ? 40 : 14) : Math.sin(time * 0.002) * 3;
      const x = side === 'L' ? 40 : W - 150, dir = side === 'L' ? 1 : -1;
      g.fillStyle(0x5a2a3a, 0.9);
      g.fillPoints([{ x: x - 6, y: 140 }, { x: x + 40, y: 140 }, { x: x + 40 + flap * dir * 1.5, y: 310 }, { x: x - 6 + flap * dir, y: 310 }], true);
      g.fillPoints([{ x: x + 76, y: 140 }, { x: x + 122, y: 140 }, { x: x + 122 + flap * dir, y: 310 }, { x: x + 76 + flap * dir * 1.5, y: 310 }], true);
      if (active && active.state === 'warn') {
        showTarget = side;
        const a = 0.55 + 0.45 * Math.sin(time * 0.02);
        eg.fillStyle(0xd8e8ff, a);                                  // big wind arrows coming from the window
        const ax = side === 'L' ? 200 : W - 200;
        for (let i = 0; i < 3; i++) { const ox = ax + dir * i * 34; eg.fillTriangle(ox, 190, ox, 250, ox + dir * 30, 220); }
      }
    }
    // the glowing target where the hand must go
    if (showTarget && this.state === 'play') {
      const p = this.shieldPoint(showTarget), ok = this.shielded(showTarget), a = 0.6 + 0.4 * Math.sin(time * 0.025);
      eg.lineStyle(4, ok ? 0x7fffa0 : 0xffd27a, a); eg.strokeCircle(p.x, p.y, 40);
      eg.fillStyle(ok ? 0x7fffa0 : 0xffd27a, 0.15 * a); eg.fillCircle(p.x, p.y, 40);
      this.shieldTxt.setPosition(p.x, p.y - 64).setText(ok ? 'GOOD! HOLD IT' : 'PUT YOUR\nHAND HERE').setColor(ok ? '#7fffa0' : '#ffd27a').setVisible(true);
    } else if (this.shieldTxt) this.shieldTxt.setVisible(false);
  }

  // ================= room: THE CHASE =================
  startChase() {
    this.mode = 'chase';
    this.chase = { x: this.kid.x - 320, spawnT: 1.0 };
    Sfx.roar(); this.cameras.main.shake(600, 0.012);
    this.say('THE DARK IS COMING.\nRUN!! CLEAR THE WAY!', 2.5);
  }
  updateChase(dt) {
    const ch = this.chase, k = this.kid;
    const gap = k.x - ch.x;
    ch.x += (TUNE.chaseSpeed + Math.max(0, gap - 250) * 0.5) * dt;
    ch.spawnT -= dt;
    if (ch.spawnT <= 0 && k.x < this.doorX - 350) {
      ch.spawnT = 1.0 + Math.random() * 0.5;
      const r = Math.random(), cx = this.cameras.main.scrollX;
      if (r < 0.22) this.spawnMonster('brute', cx + W + 20, 0);
      else if (r < 0.4) this.spawnEntry({ conga: 'R', n: 4, type: 'wisp', y: FLOOR - 40 });
      else if (r < 0.55) this.spawnMonster('snuffer', cx + W + 20, FLOOR - 230);
      else { this.spawnMonster('wisp', cx + W + 20, FLOOR - 60 - Math.random() * 150); this.spawnMonster('wisp', cx + W + 70, FLOOR - 80 - Math.random() * 150); }
    }
    for (const m of this.monsters) if (m.alive && !m.held && m.x < ch.x + 20) this.killMonster(m, 'quiet');
    if (ch.x > k.x - 18) this.fail('THE DARK CAUGHT HIM...');
  }
  drawChase(time) {
    const g = this.chaseG; g.clear();
    if (!this.chase) return;
    const x = this.chase.x;
    g.fillStyle(0x020106, 1); g.fillRect(x - 900, 0, 900, H);
    for (let i = 0; i < 14; i++) {
      const yy = 30 + i * 36, w = 40 + Math.sin(time * 0.004 + i * 1.7) * 30;
      g.fillStyle(0x020106, 0.9); g.fillCircle(x + w * 0.5, yy, 34 + Math.sin(time * 0.005 + i) * 8);
      g.fillStyle(0x020106, 0.5); g.fillCircle(x + w, yy + 10, 26);
    }
    for (let i = 0; i < 12; i++) {
      const ex = x - 30 - (i * 53) % 260, ey = 60 + (i * 97) % 380;
      if (Math.sin(time * 0.003 + i * 2) > -0.8) { g.fillStyle(i % 3 ? 0xffe066 : 0xff3344); g.fillTriangle(ex - 9, ey - 3, ex - 2, ey, ex - 8, ey + 3); g.fillTriangle(ex + 9, ey - 3, ex + 2, ey, ex + 8, ey + 3); }
    }
  }

  // ================= room: LIGHTS OUT =================
  darkStart() {

  update(time, dtMs) {
    if (this.paused) return;
    const rdt = Math.min(dtMs / 1000, 1 / 30);

    const wantGiant = this.rage > 0 || (this.state === 'play' && this.mode !== 'dark' && (ptr.rightButtonDown() || this.keys.SPACE.isDown || this.keys.SHIFT.isDown));
    const wasGiant = this.g > 0.5;
    this.g += ((wantGiant ? 1 : 0) - this.g) * Math.min(1, rdt * 12);
    if (!wasGiant && this.g > 0.5) { Sfx.grow(); this.punch = Math.min(0.06, this.punch + 0.03); }
    const S = this.S, lightR = this.lightR, cp = this.candlePos;

      const targetX = Phaser.Math.Clamp(k.x - (this.mode === 'chase' ? 300 : 330), 0, this.WORLD - W);
      cam.scrollX += (targetX - cam.scrollX) * Math.min(1, rdt * 5);
    }
    this.punch *= 0.86; cam.setZoom(1 + this.punch + (this.slowT > 0 ? 0.05 : 0));
    this.slowTint.setAlpha(this.state === 'qte' ? 0.18 : this.slowT > 0 ? 0.12 : 0);
    k.blinkT -= rdt; if (k.blinkT < -0.12) k.blinkT = 2 + Math.random() * 3;

    if (this.stopT > 0) { this.stopT -= rdt; this.render(time, rdt, S, lightR, cp); return; }

    // scripted walking (room entry / boss ending) and exit run
    if (this.kidWalkTo !== undefined) {
      if (Math.abs(k.x - this.kidWalkTo) > 3) { k.x += Math.sign(this.kidWalkTo - k.x) * (this.state === 'cut' && R.type === 'boss' && this.boss.defeated ? 50 : TUNE.runSpeed) * rdt; k.walk += rdt * 10; k.moving = true; k.face = Math.sign(this.kidWalkTo - k.x) || 1; }
      else { this.kidWalkTo = undefined; k.moving = false; }
    } else if (this.state === 'exit') { k.x += TUNE.runSpeed * 1.3 * rdt; k.walk += rdt * 12; k.moving = true; k.face = 1; }
    else if (this.state !== 'play') k.moving = false;

    if (this.state === 'qte') this.updateQTE(rdt);

    if (this.timeStop > 0) {

  updateHand(dt, time, S) {

  updateMonsters(dt, time, cp, lightR) {
    const k = this.kid, hd = this.hand, cam = this.cameras.main;
    const fast = this.form === 'hand' && Math.hypot(hd.vx, hd.vy) > (this.rage > 0 ? 500 : 900) && this.canUseHand();

        const ddx = target.x - m.x, ddy = target.y - m.y, dd = Math.hypot(ddx, ddy) || 1;

  }
  update(time, dtMs) {
    if (this.idx < 0 || this.idx >= CARDS.length) return;
    const c = CARDS[this.idx], dt = dtMs / 1000;

        g.fillStyle(0x8a5cff, 0.25); g.fillCircle(x, y, r * 1.6);
        g.fillStyle(0x06040c); g.fillCircle(x, y, r);
        g.fillStyle(0xffe066); g.fillTriangle(x - 12, y - 6, x - 3, y - 3, x - 10, y + 2); g.fillTriangle(x + 12, y - 6, x + 3, y - 3, x + 10, y + 2);

      this.glow.setPosition(cx, 260).setScale(4);
    }
  }
  drawScaled(g, s, ox, oy, fn) {

    const P = {

      fillRect: (x, y, w, h) => g.fillRect(ox + x * s, oy + y * s, w * s, h * s),
      fillRoundedRect: (x, y, w, h, r) => g.fillRoundedRect(ox + x * s, oy + y * s, w * s, h * s, r * s),
      fillCircle: (x, y, r) => g.fillCircle(ox + x * s, oy + y * s, r * s),

      lineBetween: (a, b, c, d) => g.lineBetween(ox + a * s, oy + b * s, ox + c * s, oy + d * s),
      beginPath: () => g.beginPath(), arc: (x, y, r, a0, a1) => g.arc(ox + x * s, oy + y * s, r * s, a0, a1), strokePath: () => g.strokePath(),
    };
    fn(P);
  }
}

    const D = 40, items = [];
    const bestAll = Best.get(), newHigh = score > (bestAll.score || 0) && !r.get('autoplay');

    items.push(addText(this, cx, 158, 'YOU ARE HIS SHADOW.', 12, '#ffffff').setOrigin(0.5));
    const row = (i, label, value, color = '#ffffff') => {
      const y = py + 30 + i * 34;

    row(0, 'SCORE', score.toLocaleString('en-US'));

// =====================================================================
//  TRAILER: press V on the title. Records a ~3 minute trailer to a .webm:
//  a cinematic teaser (~45 s) followed by real gameplay played by the autopilot.
// =====================================================================
const Recorder = {
  rec: null, chunks: [],
  start(canvas) {
    try {
      const hd = document.createElement('canvas'); hd.width = 1920; hd.height = 1080;
      const hx = hd.getContext('2d'); hx.imageSmoothingEnabled = false;
      this.copy = () => { hx.drawImage(canvas, 0, 0, 1920, 1080); if (this.track && this.track.requestFrame) this.track.requestFrame(); };
      window.game.events.on('postrender', this.copy);
      const vs = hd.captureStream(this.manual ? 0 : 60); this.track = vs.getVideoTracks()[0];
      const tracks = [this.track];
      const as = AudioSys.stream(); if (as) tracks.push(...as.getAudioTracks());
      const types = ['video/webm;codecs=vp8,opus', 'video/webm;codecs=vp9,opus', 'video/webm'];   // VP8 plays smoothly on more laptops
      const mimeType = types.find(t => window.MediaRecorder && MediaRecorder.isTypeSupported(t));
      this.rec = new MediaRecorder(new MediaStream(tracks), { mimeType, videoBitsPerSecond: 14000000 });
      this.chunks = [];
      this.rec.ondataavailable = (e) => { if (e.data && e.data.size) this.chunks.push(e.data); };
      this.rec.start(1000);
      return true;
    } catch (e) { console.warn('recording not available', e); this.rec = null; return false; }
  },
  stop() {
    return new Promise((res) => {
      if (!this.rec) { res(null); return; }
      this.rec.onstop = () => res(new Blob(this.chunks, { type: 'video/webm' }));
      if (this.copy) window.game.events.off('postrender', this.copy);
      this.rec.stop();
    });
  },
  save(blob) {
    if (!blob) return;
    if (window.__trailerUpload) { window.__trailerUpload(blob); return; }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'SHADE_trailer.webm';
    document.body.appendChild(a); a.click(); a.remove();
  },
};

function startTrailer(scene) {
  AudioSys.ac();
  const r = scene.registry;
  r.set('autoplay', true); r.set('trailer', true);
  r.set('score', 0); r.set('best', 0); r.set('rewinds', 0); r.set('t0', Date.now()); r.set('ratings', []); r.set('seen', {});
  Recorder.start(scene.game.canvas);
  scene.scene.start('Teaser');
}

        this.glow.setPosition(cx, H / 2).setTint(0xc9a8ff).setScale(4).setAlpha(0.4);
        const s = 18 + this.shotT * 60;
        drawClaw(g, cx, H / 2, s * 1.1, -Math.PI / 2, false, 0.5, 0x6a3cff);
        drawClaw(g, cx, H / 2, s, -Math.PI / 2, false, 0.95);
        break;
      }
      case 'giant': {
        this.glow.setPosition(cx, H / 2).setTint(0x6a3cff).setScale(4.5).setAlpha(0.35);
        const S = 10 + this.shotT * 3;
        const pose = drawShadowBody(g, cx, S, time, 0, 0.95, -0.03, 0x05030c, 0.35);
        g.fillStyle(0xc9a8ff, 0.95); g.fillEllipse(pose.head.x - 2.2 * S, pose.head.y + 0.3 * S, 1.3 * S, 0.6 * S); g.fillEllipse(pose.head.x + 2.2 * S, pose.head.y + 0.3 * S, 1.3 * S, 0.6 * S);
        break;
      }
      case 'clock': {
        this.glow.setPosition(cx, H / 2).setTint(0xffd27a).setScale(4).setAlpha(0.3);
        const p = Math.min(1, this.shotT / 2.6), r = 120;
        fx.lineStyle(6, 0xffd27a, 1); fx.strokeCircle(cx, H / 2 - 10, r);
        for (let i = 0; i < 12; i++) { const a = i / 12 * Math.PI * 2; fx.lineBetween(cx + Math.cos(a) * (r - 18), H / 2 - 10 + Math.sin(a) * (r - 18), cx + Math.cos(a) * (r - 4), H / 2 - 10 + Math.sin(a) * (r - 4)); }
        const mins = 660 + p * 59, ma = -Math.PI / 2 + (mins % 60) / 60 * Math.PI * 2 * 8, ha = -Math.PI / 2 + (mins / 60 % 12) / 12 * Math.PI * 2;
        fx.lineStyle(5, 0xffffff, 1); fx.lineBetween(cx, H / 2 - 10, cx + Math.cos(ma) * (r - 24), H / 2 - 10 + Math.sin(ma) * (r - 24));
        fx.lineStyle(8, 0xffb347, 1); fx.lineBetween(cx, H / 2 - 10, cx + Math.cos(ha) * (r - 55), H / 2 - 10 + Math.sin(ha) * (r - 55));
        if (Math.floor(this.shotT * 6) !== this.lastTick) { this.lastTick = Math.floor(this.shotT * 6); Sfx.tick(); }
        if (!this.clockTxt) this.clockTxt = addText(this, cx, H / 2 + 130, '', 18, '#ffd27a').setOrigin(0.5).setDepth(6);
        this.clockTxt.setVisible(true).setText(fmtClock(1380 + Math.floor(p * 59)));
        break;
      }
      case 'hollowEyes': case 'hollow': {
        const S = this.shot === 'hollow' ? 15 + this.shotT * 1.5 : 26;
        this.glow.setPosition(cx, 260).setTint(0xff6a8a).setScale(4.5).setAlpha(0.3);
        const pose = drawShadowBody(g, cx + 20, S, time, 0, 0.95, 0.04, 0x030208, 0.25);
        const open = Math.min(1, this.shotT * 2.5);
        g.fillStyle(0xffffff, 1); g.fillEllipse(pose.head.x - 2.6 * S, pose.head.y, 1.6 * S, 2.4 * S * open); g.fillEllipse(pose.head.x + 2.6 * S, pose.head.y, 1.6 * S, 2.4 * S * open);
        g.fillStyle(0xff6a8a, 0.5 + 0.3 * Math.sin(time * 0.008)); g.fillCircle(pose.chest.x, pose.chest.y, 1.4 * S);
        break;
      }
      case 'logo': {
        this.glow.setPosition(cx, H / 2 - 30).setTint(0xff8a2a).setScale(4).setAlpha(0.35 + Math.sin(time * 0.02) * 0.03);
        break;
      }
    }
    if (this.smileTxt && this.shot !== 'miloSmile') this.smileTxt.setVisible(false);
    if (this.clockTxt && this.shot !== 'clock') this.clockTxt.setVisible(false);
  }
}

// The autopilot: plays the real game for the trailer recording.
function autoBot(g) {
  if (!g.kid) return;
  const ptr = g.input.activePointer, cam = g.cameras.main, k = g.kid, K = g.keys;
  K.A.isDown = false; K.D.isDown = false;
  g._ab = g._ab || { holdF: 0, frame: 0, throwT: 0 };
  const A = g._ab; A.frame++;
  if (g.state === 'qte') { if (A.frame % 3 === 0) g.qteHit(); return; }
  if (g.state !== 'play') return;
  if (g.mode === 'dark') { K.D.isDown = true; return; }
  if (g.chase && (k.x - g.chase.x < 150 || (!A.usedStop && g.roomT > 2.5))) { if (g.stopCool <= 0 && g.timeStop <= 0) A.usedStop = true; g.stopTime(); }
  if (g.boss && !g.boss.defeated && g.boss.hand.st === 'aim' && g.stopCool <= 0 && g.boss.phase === 3 && !A.bossStop) { A.bossStop = true; g.stopTime(); }
  const aim = (x, y) => { ptr.x = x - cam.scrollX; ptr.y = y; };
  const b = g.boss, ms = g.monsters.filter(m => m.alive && !m.held && !m.thrown);
  K.SPACE.isDown = false;
  if (b && !b.defeated) {
    const hd = b.hand;
    if (hd.st === 'raise' || hd.st === 'aim' || hd.st === 'slam') { g.setForm('hand'); aim(hd.tx, FLOOR - 70); K.SPACE.isDown = true; return; }
    if (b.stun > 0) {
      const c = g.bossCore();
      if (g.wolfCool <= 0 && !g.dash && A.frame % 2) { g.setForm('wolf'); aim(c.x, c.y); g.action(); return; }
      g.setForm('hand'); aim(c.x, c.y); K.SPACE.isDown = true;
      if (Math.hypot(g.hand.x - c.x, g.hand.y - c.y) < g.handR + 50 && g.cool <= 0) g.smash();
      return;
    }
  }
  if (g.R.type === 'wind' && g.gusts) {
    const gu = g.gusts.find(x => x.state === 'warn' || (x.state === 'wait' && g.windT >= x.t - 1.2));
    if (gu) { g.setForm('hand'); const cp = g.candlePos; aim(cp.x + (gu.side === 'L' ? -40 : 40), cp.y); return; }
  }
  if (g.held) {
    const t = ms.find(m => m.type === 'brute') || ms[0]; A.holdF++;
    if (t) { const dx = t.x - g.hand.x, dy = t.y - g.hand.y, d = Math.hypot(dx, dy) || 1; aim(g.hand.x + dx / d * 130, g.hand.y + dy / d * 130); }
    if (A.holdF >= 7) { g.release(); A.holdF = 0; }
    return;
  }
  if (!ms.length) { g.setForm(g.unlocked.includes('wolf') && A.frame % 400 < 200 ? 'wolf' : 'hand'); aim(k.x + 90, FLOOR - 170); return; }
  const march = ms.filter(m => m.march), brutes = ms.filter(m => m.type === 'brute'), sn = ms.find(m => m.type === 'snuffer');
  if (sn && Math.hypot(sn.x - g.candlePos.x, sn.y - g.candlePos.y) < 260) { g.setForm('hand'); aim(sn.x, sn.y); K.SPACE.isDown = true; if (Math.hypot(sn.x - g.hand.x, sn.y - g.hand.y) < g.handR * 1.2 + sn.r && g.cool <= 0) g.smash(); return; }
  if (g.unlocked.includes('wolf') && g.wolfCool <= 0 && !g.dash && (march.length || brutes.length)) {
    const t = (march.length ? march : brutes).sort((a, c) => Math.abs(a.x - k.x) - Math.abs(c.x - k.x))[0];
    g.setForm('wolf'); aim(t.x + Math.sign(t.x - k.x) * 90, t.y); g.action(); return;
  }
  if (g.unlocked.includes('raven') && g.ravenCool <= 0 && ms.length >= 3) { const t = ms[0]; g.setForm('raven'); aim(t.x, t.y); g.action(); return; }
  let t = null, bd = 1e9;
  for (const m of ms) { const d = Math.hypot(m.x - k.x, m.y - (FLOOR - 32)) - (m.wind || m.lunge ? 200 : 0); if (d < bd) { bd = d; t = m; } }
  g.setForm('hand'); aim(t.x, t.y);
  const sh = g.hand.sh; K.SPACE.isDown = sh ? Math.hypot(t.x - sh.x, t.y - sh.y) > TUNE.reachPerScale * TUNE.scaleNormal * 0.9 : false;
  if (Math.hypot(t.x - g.hand.x, t.y - g.hand.y) < g.handR * 1.2 + t.r && g.cool <= 0) {
    if (t.type === 'wisp' && (brutes.length || ms.length >= 3)) { g.press(); A.holdF = 0; } else g.smash();
  }
}

// ---------------- mute button ----------------
(() => {
  const btn = document.getElementById('mute');
  const ON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8.5 8.5 0 0 1 0 12"/></svg>';
  const OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M17 9l5 6M22 9l-5 6"/></svg>';
  window.syncMute = () => {
    const m = AudioSys.muted;
    btn.innerHTML = m ? OFF : ON;
    btn.setAttribute('aria-pressed', String(m));
    btn.setAttribute('aria-label', m ? 'Turn sound on' : 'Mute sound');
    btn.title = m ? 'Sound off - click to turn on (M)' : 'Sound on - click to mute (M)';
  };
  btn.addEventListener('click', () => { AudioSys.ac(); AudioSys.toggleMute(); btn.blur(); });
  window.syncMute();
})();
